<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Shop Parts - ADD Motor Shop
    </title>


    <style>

        :root {

            --black: #080808;
            --black-light: #111111;
            --black-card: #151515;

            --red: #dc2626;
            --red-light: #ef4444;
            --red-dark: #991b1b;

            --white: #ffffff;
            --text: #f5f5f5;
            --muted: #a3a3a3;

            --border: #292929;

            --green: #22c55e;

        }


        * {

            margin: 0;
            padding: 0;

            box-sizing: border-box;

            font-family:
                'Segoe UI',
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

        }


        body {

            min-height: 100vh;

            color: var(--text);

            background:

                radial-gradient(
                    circle at 10% 20%,
                    rgba(220, 38, 38, 0.14),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 90% 80%,
                    rgba(220, 38, 38, 0.10),
                    transparent 30%
                ),

                linear-gradient(
                    135deg,
                    #050505,
                    #100505,
                    #080808
                );

        }


        /* ==============================
           NAVBAR
        ============================== */

        .navbar {

            height: 70px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 35px;

            background:
                linear-gradient(
                    90deg,
                    #080808,
                    #180606,
                    #080808
                );

            border-bottom:
                1px solid #351313;

            position: sticky;

            top: 0;

            z-index: 1000;

        }


        .logo {

            font-size: 1.5rem;

            font-weight: 800;

            letter-spacing: 1px;

            color: white;

        }


        .logo span {

            color: var(--red-light);

        }


        .nav-links {

            display: flex;

            align-items: center;

            gap: 5px;

        }


        .nav-links a {

            color: var(--muted);

            text-decoration: none;

            font-size: 0.82rem;

            padding: 9px 12px;

            border-radius: 7px;

            transition: 0.2s ease;

        }


        .nav-links a:hover {

            color: white;

            background:
                rgba(220, 38, 38, 0.10);

        }


        .cart-link {

            color:
                #fca5a5 !important;

        }


        /* ==============================
           CONTAINER
        ============================== */

        .container {

            width: 100%;

            max-width: 1250px;

            margin: auto;

            padding:
                35px 25px 60px;

        }


        /* ==============================
           HEADER
        ============================== */

        .page-header {

            margin-bottom: 25px;

        }


        .page-header h1 {

            font-size: 2rem;

            margin-bottom: 8px;

        }


        .page-header h1 span {

            color:
                var(--red-light);

        }


        .page-header p {

            color:
                var(--muted);

            font-size: 0.88rem;

        }


        /* ==============================
           USER INFO
        ============================== */

        .user-box {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            margin-bottom: 25px;

            padding: 15px 18px;

            background:
                rgba(220, 38, 38, 0.06);

            border:
                1px solid #3a1717;

            border-radius: 10px;

        }


        .user-info {

            color:
                var(--muted);

            font-size: 0.78rem;

        }


        .user-info strong {

            color: white;

        }


        .cart-button {

            display: inline-flex;

            align-items: center;

            gap: 7px;

            padding:
                10px 16px;

            background:
                var(--red);

            color: white;

            text-decoration: none;

            border-radius: 8px;

            font-size: 0.78rem;

            font-weight: 600;

            transition: 0.2s ease;

        }


        .cart-button:hover {

            background:
                var(--red-light);

        }


        /* ==============================
           PRODUCTS GRID
        ============================== */

        .products-grid {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 18px;

        }


        .product-card {

            display: flex;

            flex-direction: column;

            overflow: hidden;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.035),
                    rgba(220,38,38,0.025)
                );

            border:
                1px solid var(--border);

            border-radius: 12px;

            transition:
                0.25s ease;

        }


        .product-card:hover {

            transform:
                translateY(-4px);

            border-color:
                rgba(220,38,38,0.45);

            box-shadow:
                0 15px 35px
                rgba(0,0,0,0.35);

        }


        /* ==============================
           PRODUCT IMAGE
        ============================== */

        .product-image {

            height: 190px;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    145deg,
                    #111,
                    #181818
                );

            border-bottom:
                1px solid #252525;

            overflow: hidden;

        }


        .product-image img {

            width: 100%;

            height: 100%;

            object-fit: contain;

            padding: 15px;

        }


        .no-image {

            font-size: 3rem;

            opacity: 0.45;

        }


        /* ==============================
           PRODUCT INFORMATION
        ============================== */

        .product-info {

            display: flex;

            flex-direction: column;

            flex: 1;

            padding: 17px;

        }


        .category {

            display: inline-block;

            width: fit-content;

            margin-bottom: 8px;

            padding:
                4px 8px;

            border-radius: 20px;

            color:
                #fca5a5;

            background:
                rgba(220,38,38,0.10);

            border:
                1px solid
                rgba(220,38,38,0.20);

            font-size: 0.58rem;

            font-weight: 600;

        }


        .product-name {

            color: white;

            font-size: 0.9rem;

            font-weight: 700;

            margin-bottom: 7px;

        }


        .product-description {

            min-height: 42px;

            color:
                #858585;

            font-size: 0.68rem;

            line-height: 1.5;

            margin-bottom: 14px;

        }


        .product-bottom {

            display: flex;

            align-items: flex-end;

            justify-content: space-between;

            gap: 10px;

            margin-top: auto;

        }


        .price {

            color:
                var(--red-light);

            font-size: 1rem;

            font-weight: 800;

        }


        .stock {

            margin-top: 4px;

            color:
                #737373;

            font-size: 0.6rem;

        }


        .stock.available {

            color:
                #86efac;

        }


        .stock.low {

            color:
                #fde68a;

        }


        .add-button {

            border: none;

            cursor: pointer;

            padding:
                9px 12px;

            border-radius: 7px;

            background:
                var(--red);

            color: white;

            font-size: 0.68rem;

            font-weight: 600;

            transition: 0.2s ease;

        }


        .add-button:hover {

            background:
                var(--red-light);

        }


        .add-button:disabled {

            cursor: not-allowed;

            opacity: 0.5;

        }


        /* ==============================
           MESSAGE
        ============================== */

        .message {

            display: none;

            margin-bottom: 20px;

            padding: 13px 16px;

            border-radius: 8px;

            font-size: 0.75rem;

        }


        .message.success {

            display: block;

            color: #bbf7d0;

            background:
                rgba(34,197,94,0.10);

            border:
                1px solid
                rgba(34,197,94,0.25);

        }


        .message.error {

            display: block;

            color: #fecaca;

            background:
                rgba(220,38,38,0.10);

            border:
                1px solid
                rgba(220,38,38,0.25);

        }


        /* ==============================
           LOADING
        ============================== */

        .loading {

            padding: 60px 20px;

            text-align: center;

            color:
                var(--muted);

        }


        .empty {

            grid-column:
                1 / -1;

            padding: 60px 20px;

            text-align: center;

            color:
                var(--muted);

            border:
                1px solid var(--border);

            border-radius: 12px;

            background:
                rgba(255,255,255,0.02);

        }


        .empty-icon {

            font-size: 3rem;

            margin-bottom: 15px;

        }


        /* ==============================
           RESPONSIVE
        ============================== */

        @media (max-width: 1050px) {

            .products-grid {

                grid-template-columns:
                    repeat(3, 1fr);

            }

        }


        @media (max-width: 800px) {

            .products-grid {

                grid-template-columns:
                    repeat(2, 1fr);

            }

            .navbar {

                padding:
                    0 18px;

            }

        }


        @media (max-width: 550px) {

            .nav-links a {

                display: none;

            }

            .products-grid {

                grid-template-columns:
                    1fr;

            }

            .container {

                padding:
                    25px 15px 45px;

            }

            .user-box {

                align-items:
                    flex-start;

                flex-direction:
                    column;

            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         NAVIGATION
    ========================================== -->

    <nav class="navbar">

        <div class="logo">

            ADD <span>MOTOR</span>

        </div>


        <div class="nav-links">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="book-service.html">
                Book Service
            </a>

            <a href="appointments.html">
                Appointments
            </a>

            <a href="motorcycles.html">
                Motorcycles
            </a>

            <a href="profile.html">
                Profile
            </a>

            <a
                href="cart.html"
                class="cart-link"
            >
                🛒 Cart
            </a>

        </div>

    </nav>



    <!-- =========================================
         MAIN
    ========================================== -->

    <main class="container">


        <div class="page-header">

            <h1>
                Shop <span>Parts</span>
            </h1>

            <p>
                Browse motorcycle parts and products
                available from ADD Motor Shop.
            </p>

        </div>



        <!-- USER -->

        <div class="user-box">

            <div class="user-info">

                Logged in as:
                <strong id="userName">
                    Customer
                </strong>

                <br>

                User ID:
                <strong id="userId">
                    -
                </strong>

            </div>


            <a
                href="cart.html"
                class="cart-button"
            >
                🛒 View Cart
            </a>

        </div>



        <!-- MESSAGE -->

        <div
            id="message"
            class="message"
        ></div>



        <!-- PRODUCTS -->

        <div
            id="products"
            class="products-grid"
        >

            <div class="loading">

                Loading products...

            </div>

        </div>


    </main>



    <script>

        /* =========================================
           API
        ========================================== */

        const API_BASE =
            "http://localhost:3000/api";



        /* =========================================
           GET LOGGED-IN USER
        ========================================== */

        function getLoggedInUser() {

            const possibleKeys = [

                "loggedInUser",
                "user",
                "currentUser"

            ];


            for (
                const key of possibleKeys
            ) {

                const stored =
                    localStorage.getItem(key);


                if (!stored) {

                    continue;

                }


                try {

                    const user =
                        JSON.parse(stored);


                    if (
                        user &&
                        user.id
                    ) {

                        return user;

                    }

                } catch (error) {

                    console.error(
                        "Invalid stored user:",
                        error
                    );

                }

            }


            return null;

        }



        /* =========================================
           USER
        ========================================== */

        const currentUser =
            getLoggedInUser();


        if (!currentUser) {

            alert(
                "Please log in before shopping."
            );


            window.location.href =
                "login.html";

        }



        if (currentUser) {

            document.getElementById(
                "userName"
            ).textContent =
                currentUser.name || "Customer";


            document.getElementById(
                "userId"
            ).textContent =
                currentUser.id;

        }



        /* =========================================
           MESSAGE
        ========================================== */

        function showMessage(
            text,
            type
        ) {

            const message =
                document.getElementById(
                    "message"
                );


            message.textContent =
                text;


            message.className =
                "message " + type;


            setTimeout(() => {

                message.className =
                    "message";

            }, 3000);

        }



        /* =========================================
           LOAD PRODUCTS
        ========================================== */

        async function loadProducts() {

            const container =
                document.getElementById(
                    "products"
                );


            try {

                const response =
                    await fetch(
                        `${API_BASE}/products`
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "Unable to load products."
                    );

                }


                const products =
                    data.products || [];


                if (
                    products.length === 0
                ) {

                    container.innerHTML = `

                        <div class="empty">

                            <div class="empty-icon">
                                🏍️
                            </div>

                            <h2>
                                No products available
                            </h2>

                            <p style="margin-top:8px;">
                                There are currently
                                no products available
                                for purchase.
                            </p>

                        </div>

                    `;

                    return;

                }


                container.innerHTML = "";


                products.forEach(
                    product => {

                        const stock =
                            Number(
                                product.stock
                            );


                        let stockText =
                            `${stock} available`;

                        let stockClass =
                            "available";


                        if (
                            stock <= 0
                        ) {

                            stockText =
                                "Out of stock";

                            stockClass = "";

                        } else if (
                            stock <= 5
                        ) {

                            stockText =
                                `Only ${stock} left`;

                            stockClass =
                                "low";

                        }


                        let imageHTML = `

                            <div class="no-image">
                                🏍️
                            </div>

                        `;


                        if (
                            product.image
                        ) {

                            imageHTML = `

                                <img
                                    src="${product.image}"
                                    alt="${escapeHTML(
                                        product.name
                                    )}"
                                    onerror="
                                        this.style.display='none';
                                        this.parentElement.innerHTML='<div class=no-image>🏍️</div>';
                                    "
                                >

                            `;

                        }


                        const card =
                            document.createElement(
                                "div"
                            );


                        card.className =
                            "product-card";


                        card.innerHTML = `

                            <div class="product-image">

                                ${imageHTML}

                            </div>


                            <div class="product-info">

                                <span class="category">

                                    ${escapeHTML(
                                        product.category ||
                                        "Product"
                                    )}

                                </span>


                                <div class="product-name">

                                    ${escapeHTML(
                                        product.name
                                    )}

                                </div>


                                <div class="product-description">

                                    ${escapeHTML(
                                        product.description ||
                                        "Motorcycle product."
                                    )}

                                </div>


                                <div class="product-bottom">

                                    <div>

                                        <div class="price">

                                            ₱${Number(
                                                product.price
                                            ).toFixed(2)}

                                        </div>


                                        <div
                                            class="stock ${stockClass}"
                                        >

                                            ${stockText}

                                        </div>

                                    </div>


                                    <button
                                        class="add-button"
                                        ${stock <= 0 ? "disabled" : ""}
                                        onclick="
                                            addToCart(
                                                ${product.id},
                                                this
                                            )
                                        "
                                    >

                                        ${stock <= 0
                                            ? "Out of Stock"
                                            : "Add to Cart"
                                        }

                                    </button>

                                </div>

                            </div>

                        `;


                        container.appendChild(
                            card
                        );

                    }
                );


            } catch (error) {

                console.error(
                    "Load products error:",
                    error
                );


                container.innerHTML = `

                    <div class="empty">

                        <div class="empty-icon">
                            ⚠️
                        </div>

                        <h2>
                            Unable to load products
                        </h2>

                        <p style="margin-top:8px;">
                            ${escapeHTML(
                                error.message
                            )}
                        </p>

                    </div>

                `;

            }

        }



        /* =========================================
           ADD TO CART
        ========================================== */

        async function addToCart(
            productId,
            button
        ) {

            if (!currentUser) {

                alert(
                    "Please log in first."
                );

                window.location.href =
                    "login.html";

                return;

            }


            const originalText =
                button.textContent;


            button.disabled = true;

            button.textContent =
                "Adding...";


            try {

                const response =
                    await fetch(
                        `${API_BASE}/cart/items`,
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    user_id:
                                        Number(
                                            currentUser.id
                                        ),

                                    product_id:
                                        Number(
                                            productId
                                        ),

                                    quantity:
                                        1

                                })

                        }
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "Unable to add product."
                    );

                }


                showMessage(
                    "Product added to your cart!",
                    "success"
                );


                button.textContent =
                    "Added ✓";


                setTimeout(() => {

                    button.disabled =
                        false;

                    button.textContent =
                        originalText;

                }, 1500);


            } catch (error) {

                console.error(
                    "Add to cart error:",
                    error
                );


                showMessage(
                    error.message,
                    "error"
                );


                button.disabled =
                    false;

                button.textContent =
                    originalText;

            }

        }



        /* =========================================
           ESCAPE HTML
        ========================================== */

        function escapeHTML(
            value
        ) {

            return String(value)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }



        /* =========================================
           START
        ========================================== */

        if (currentUser) {

            loadProducts();

        }

    </script>


</body>

</html>
