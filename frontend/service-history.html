<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Service History - ADD Motor Shop</title>

    <!-- Shared Customer Header CSS -->
    <link
        rel="stylesheet"
        href="css/customer-header.css"
    >

    <!-- Service History CSS -->
    <link
        rel="stylesheet"
        href="css/service-history.css"
    >
</head>

<body>

    <!-- =========================
         SHARED CUSTOMER HEADER
    ========================== -->

    <div id="customerHeader"></div>


    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="page-container">

        <!-- PAGE HEADER -->

        <div class="page-header">

            <h1>
                Service <span>History</span>
            </h1>

            <p>
                View your previous motorcycle repair and maintenance services.
            </p>

        </div>


        <!-- SUMMARY -->

        <div class="summary-grid">

            <div class="summary-card">

                <div class="summary-title">
                    Total Services
                </div>

                <div
                    class="summary-number red"
                    id="totalServices"
                >
                    0
                </div>

            </div>


            <div class="summary-card">

                <div class="summary-title">
                    Completed Appointments
                </div>

                <div
                    class="summary-number"
                    id="completedAppointments"
                >
                    0
                </div>

            </div>


            <div class="summary-card">

                <div class="summary-title">
                    Total Amount Spent
                </div>

                <div
                    class="summary-number red"
                    id="totalSpent"
                >
                    ₱0
                </div>

            </div>

        </div>


        <!-- FILTERS -->

        <div class="filter-section">

            <div class="search-box">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search service, motorcycle, or appointment..."
                >

            </div>


            <select
                class="filter-select"
                id="motorcycleFilter"
            >

                <option value="all">
                    All Motorcycles
                </option>

            </select>


            <select
                class="filter-select"
                id="yearFilter"
            >

                <option value="all">
                    All Years
                </option>

            </select>

        </div>


        <!-- HISTORY LIST -->

        <div
            class="history-container"
            id="historyContainer"
        ></div>


        <!-- EMPTY STATE -->

        <div
            class="empty-state"
            id="emptyState"
        >

            <div class="empty-icon">
                🏍️
            </div>

            <h3>
                No Service History Found
            </h3>

            <p>
                No service records match your current search or filter.
            </p>

            <a
                href="book-service.html"
                class="book-btn"
            >
                Book a Service
            </a>

        </div>

    </main>


    <!-- =========================
         DETAILS MODAL
    ========================== -->

    <div
        class="modal"
        id="detailsModal"
    >

        <div class="modal-content">

            <div class="modal-header">

                <h2>
                    Service Details
                </h2>

                <button
                    class="close-btn"
                    type="button"
                    onclick="closeModal()"
                >
                    ×
                </button>

            </div>

            <div
                class="modal-body"
                id="modalBody"
            ></div>

        </div>

    </div>


    <!-- =========================
         SERVICE HISTORY JAVASCRIPT
    ========================== -->

    <script>

        /* =========================
           SERVICE HISTORY - DATABASE
        ========================== */

        let serviceHistory = [];

        let currentUserId = null;


        const searchInput =
            document.getElementById("searchInput");


        const motorcycleFilter =
            document.getElementById("motorcycleFilter");


        const yearFilter =
            document.getElementById("yearFilter");


        const historyContainer =
            document.getElementById("historyContainer");


        const emptyState =
            document.getElementById("emptyState");


        const totalServices =
            document.getElementById("totalServices");


        const completedAppointments =
            document.getElementById("completedAppointments");


        const totalSpent =
            document.getElementById("totalSpent");


        const detailsModal =
            document.getElementById("detailsModal");


        const modalBody =
            document.getElementById("modalBody");


        /* =========================
           GET LOGGED-IN USER
        ========================== */

        function getLoggedInUser() {

            try {

                const storedUser =
                    JSON.parse(
                        localStorage.getItem("user")
                    );

                if (storedUser) {
                    return storedUser;
                }

            } catch (error) {

                console.warn(
                    "Unable to read stored user:",
                    error
                );

            }


            const userId =
                localStorage.getItem("userId");


            if (userId) {

                return {
                    id: userId
                };

            }


            return null;

        }


        /* =========================
           LOAD SERVICE HISTORY
        ========================== */

        async function loadServiceHistory() {

            const user =
                getLoggedInUser();


            if (!user) {

                window.location.href =
                    "login.html";

                return;

            }


            currentUserId =
                user.id ||
                user.user_id ||
                user.userId;


            if (!currentUserId) {

                window.location.href =
                    "login.html";

                return;

            }


            try {

                const response =
                    await fetch(
                        `/api/reservations/user/${currentUserId}`
                    );


                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }


                const data =
                    await response.json();


                const reservations =
                    Array.isArray(
                        data.reservations
                    )
                        ? data.reservations
                        : [];


                /*
                 * Only completed reservations
                 * belong in Service History.
                 */

                serviceHistory =
                    reservations.filter(
                        reservation =>
                            String(
                                reservation.status ||
                                ""
                            ).toLowerCase() ===
                            "completed"
                    );


                populateMotorcycleFilter();

                populateYearFilter();

                updateSummary();

                renderServiceHistory();


            } catch (error) {

                console.error(
                    "Failed to load service history:",
                    error
                );


                serviceHistory = [];

                updateSummary();

                renderServiceHistory();

            }

        }


        /* =========================
           SUMMARY
        ========================== */

        function updateSummary() {

            let servicesCount = 0;

            let spent = 0;


            serviceHistory.forEach(
                reservation => {

                    const services =
                        Array.isArray(
                            reservation.services
                        )
                            ? reservation.services
                            : [];


                    servicesCount +=
                        services.length;


                    spent += Number(
                        reservation.total ||
                        0
                    );

                }
            );


            totalServices.textContent =
                servicesCount;


            completedAppointments.textContent =
                serviceHistory.length;


            totalSpent.textContent =
                formatCurrency(spent);

        }


        /* =========================
           MOTORCYCLE FILTER
        ========================== */

        function populateMotorcycleFilter() {

            const motorcycles =
                new Set();


            serviceHistory.forEach(
                reservation => {

                    const motorcycle =
                        getMotorcycleName(reservation);


                    if (
                        motorcycle !==
                        "Unknown Motorcycle"
                    ) {

                        motorcycles.add(motorcycle);

                    }

                }
            );


            motorcycleFilter.innerHTML =
                `
                    <option value="all">
                        All Motorcycles
                    </option>
                `;


            [...motorcycles]
                .sort()
                .forEach(
                    motorcycle => {

                        const option =
                            document.createElement("option");


                        option.value =
                            motorcycle;


                        option.textContent =
                            motorcycle;


                        motorcycleFilter.appendChild(option);

                    }
                );

        }


        /* =========================
           YEAR FILTER
        ========================== */

        function populateYearFilter() {

            const years =
                new Set();


            serviceHistory.forEach(
                reservation => {

                    const year =
                        getServiceYear(reservation);


                    if (year) {
                        years.add(year);
                    }

                }
            );


            yearFilter.innerHTML =
                `
                    <option value="all">
                        All Years
                    </option>
                `;


            [...years]
                .sort(
                    (a, b) => b - a
                )
                .forEach(
                    year => {

                        const option =
                            document.createElement("option");


                        option.value =
                            String(year);


                        option.textContent =
                            String(year);


                        yearFilter.appendChild(option);

                    }
                );

        }


        /* =========================
           RENDER HISTORY
        ========================== */

        function renderServiceHistory() {

            const search =
                searchInput.value
                    .toLowerCase()
                    .trim();


            const selectedMotorcycle =
                motorcycleFilter.value;


            const selectedYear =
                yearFilter.value;


            const filtered =
                serviceHistory.filter(
                    reservation => {

                        const motorcycle =
                            getMotorcycleName(reservation);


                        const year =
                            String(
                                getServiceYear(reservation) || ""
                            );


                        const searchText =
                            [
                                motorcycle,

                                getAppointmentNumber(reservation),

                                reservation.status,

                                reservation.notes,

                                ...(
                                    Array.isArray(reservation.services)
                                        ? reservation.services.map(
                                            service => service.name
                                        )
                                        : []
                                )

                            ]
                                .join(" ")
                                .toLowerCase();


                        const matchesSearch =
                            searchText.includes(search);


                        const matchesMotorcycle =
                            selectedMotorcycle === "all" ||
                            motorcycle === selectedMotorcycle;


                        const matchesYear =
                            selectedYear === "all" ||
                            year === selectedYear;


                        return (
                            matchesSearch &&
                            matchesMotorcycle &&
                            matchesYear
                        );

                    }
                );


            historyContainer.innerHTML = "";


            if (filtered.length === 0) {

                historyContainer.style.display = "none";

                emptyState.style.display = "block";

                return;

            }


            historyContainer.style.display = "grid";

            emptyState.style.display = "none";


            filtered.forEach(
                reservation => {

                    historyContainer.appendChild(
                        createHistoryCard(reservation)
                    );

                }
            );

        }


        /* =========================
           CREATE HISTORY CARD
        ========================== */

        function createHistoryCard(reservation) {

            const card =
                document.createElement("div");


            card.className = "history-card";


            const motorcycle =
                getMotorcycleName(reservation);


            const appointmentNumber =
                getAppointmentNumber(reservation);


            const date =
                formatDate(reservation.reservation_date);


            const duration =
                formatDuration(reservation.total_duration);


            const services =
                Array.isArray(reservation.services)
                    ? reservation.services
                    : [];


            const total =
                Number(reservation.total || 0);


            const serviceTags =
                services.length

                    ? services.map(
                        service => `
                            <span class="service-tag">
                                ${escapeHTML(
                                    service.name || "Service"
                                )}
                            </span>
                        `
                    ).join("")

                    : `
                        <span class="service-tag">
                            No service details
                        </span>
                    `;


            card.innerHTML = `

                <div class="history-top">

                    <div class="appointment-info">

                        <h3>
                            ${escapeHTML(motorcycle)}
                        </h3>

                        <div class="appointment-id">
                            Appointment #${escapeHTML(appointmentNumber)}
                        </div>

                    </div>

                    <span class="status completed">
                        Completed
                    </span>

                </div>


                <div class="history-body">

                    <div class="info-item">

                        <span class="info-label">
                            Service Date
                        </span>

                        <span class="info-value">
                            ${escapeHTML(date)}
                        </span>

                    </div>


                    <div class="info-item">

                        <span class="info-label">
                            Mechanic
                        </span>

                        <span class="info-value">
                            Not recorded
                        </span>

                    </div>


                    <div class="info-item">

                        <span class="info-label">
                            Service Duration
                        </span>

                        <span class="info-value">
                            ${escapeHTML(duration)}
                        </span>

                    </div>


                    <div class="info-item">

                        <span class="info-label">
                            Payment
                        </span>

                        <span class="info-value">
                            Not recorded
                        </span>

                    </div>

                </div>


                <div class="services-section">

                    <div class="services-title">
                        Services Performed
                    </div>

                    <div class="service-list">
                        ${serviceTags}
                    </div>

                </div>


                <div class="history-footer">

                    <div>

                        <span class="total-label">
                            Total Cost:
                        </span>

                        <span class="total-price">
                            ${formatCurrency(total)}
                        </span>

                    </div>

                    <button
                        class="view-btn"
                        type="button"
                    >
                        View Details
                    </button>

                </div>

            `;


            const viewButton =
                card.querySelector(".view-btn");


            if (viewButton) {

                viewButton.addEventListener(
                    "click",
                    () => viewDetails(reservation)
                );

            }


            return card;

        }


        /* =========================
           VIEW DETAILS
        ========================== */

        function viewDetails(reservation) {

            if (!reservation) {
                return;
            }


            const services =
                Array.isArray(reservation.services)
                    ? reservation.services
                    : [];


            const servicesHTML =
                services.length

                    ? services.map(
                        service => `

                            <div class="modal-service">

                                <span>
                                    ${escapeHTML(
                                        service.name || "Service"
                                    )}
                                </span>

                                <span>
                                    ${formatCurrency(
                                        Number(service.price || 0)
                                    )}
                                </span>

                            </div>

                        `
                    ).join("")

                    : `

                        <div class="modal-service">

                            <span>
                                No service details
                            </span>

                            <span>
                                —
                            </span>

                        </div>

                    `;


            modalBody.innerHTML = `

                <div class="modal-row">

                    <span class="modal-label">
                        Appointment ID
                    </span>

                    <span class="modal-value">
                        ${escapeHTML(
                            getAppointmentNumber(reservation)
                        )}
                    </span>

                </div>


                <div class="modal-row">

                    <span class="modal-label">
                        Motorcycle
                    </span>

                    <span class="modal-value">
                        ${escapeHTML(
                            getMotorcycleName(reservation)
                        )}
                    </span>

                </div>


                <div class="modal-row">

                    <span class="modal-label">
                        Service Date
                    </span>

                    <span class="modal-value">
                        ${escapeHTML(
                            formatDate(reservation.reservation_date)
                        )}
                    </span>

                </div>


                <div class="modal-row">

                    <span class="modal-label">
                        Service Time
                    </span>

                    <span class="modal-value">
                        ${escapeHTML(
                            formatTime(reservation.reservation_time)
                        )}
                    </span>

                </div>


                <div class="modal-row">

                    <span class="modal-label">
                        Mechanic
                    </span>

                    <span class="modal-value">
                        Not recorded
                    </span>

                </div>


                <div class="modal-row">

                    <span class="modal-label">
                        Duration
                    </span>

                    <span class="modal-value">
                        ${escapeHTML(
                            formatDuration(reservation.total_duration)
                        )}
                    </span>

                </div>


                <div class="modal-row">

                    <span class="modal-label">
                        Payment Status
                    </span>

                    <span class="modal-value">
                        Not recorded
                    </span>

                </div>


                <div class="modal-services">

                    <h4>
                        Services Performed
                    </h4>

                    ${servicesHTML}

                </div>


                <div class="modal-total">

                    <span>
                        Total Cost
                    </span>

                    <span>
                        ${formatCurrency(
                            Number(reservation.total || 0)
                        )}
                    </span>

                </div>


                ${
                    reservation.notes
                        ? `

                            <div class="modal-row">

                                <span class="modal-label">
                                    Notes
                                </span>

                                <span class="modal-value">
                                    ${escapeHTML(reservation.notes)}
                                </span>

                            </div>

                        `
                        : ""
                }

            `;


            detailsModal.classList.add("show");

        }


        /* =========================
           CLOSE MODAL
        ========================== */

        function closeModal() {

            detailsModal.classList.remove("show");

        }


        /* =========================
           SEARCH + FILTER EVENTS
        ========================== */

        searchInput.addEventListener(
            "input",
            renderServiceHistory
        );


        motorcycleFilter.addEventListener(
            "change",
            renderServiceHistory
        );


        yearFilter.addEventListener(
            "change",
            renderServiceHistory
        );


        /* =========================
           CLOSE MODAL EVENTS
        ========================== */

        detailsModal.addEventListener(
            "click",
            function (event) {

                if (event.target === this) {
                    closeModal();
                }

            }
        );


        document.addEventListener(
            "keydown",
            function (event) {

                if (event.key === "Escape") {
                    closeModal();
                }

            }
        );


        /* =========================
           HELPERS
        ========================== */

        function getMotorcycleName(reservation) {

            if (
                reservation.motorcycle &&
                typeof reservation.motorcycle === "object"
            ) {

                const brand =
                    reservation.motorcycle.brand || "";


                const model =
                    reservation.motorcycle.model || "";


                const name =
                    `${brand} ${model}`.trim();


                if (name) {
                    return name;
                }

            }


            if (reservation.motorcycle_name) {
                return reservation.motorcycle_name;
            }


            if (reservation.motorcycle) {
                return String(reservation.motorcycle);
            }


            return "Unknown Motorcycle";

        }


        function getServiceYear(reservation) {

            if (
                reservation.motorcycle &&
                typeof reservation.motorcycle === "object" &&
                reservation.motorcycle.year
            ) {

                return Number(
                    reservation.motorcycle.year
                );

            }


            const date =
                new Date(reservation.reservation_date);


            if (!Number.isNaN(date.getTime())) {
                return date.getFullYear();
            }


            return "";

        }


        function getAppointmentNumber(reservation) {

            if (reservation.appointment_number) {
                return String(reservation.appointment_number);
            }


            if (reservation.reference_number) {
                return String(reservation.reference_number);
            }


            if (reservation.reservation_number) {
                return String(reservation.reservation_number);
            }


            if (reservation.id) {

                return `ADD-${String(
                    reservation.id
                ).padStart(6, "0")}`;

            }


            return "N/A";

        }


        function formatDate(value) {

            if (!value) {
                return "Not recorded";
            }


            const date =
                new Date(value);


            if (Number.isNaN(date.getTime())) {
                return String(value);
            }


            return date.toLocaleDateString(
                "en-US",
                {
                    year: "numeric",
                    month: "long",
                    day: "numeric"
                }
            );

        }


        function formatTime(value) {

            if (!value) {
                return "Not recorded";
            }


            const parts =
                String(value).split(":");


            if (parts.length < 2) {
                return String(value);
            }


            let hours =
                Number(parts[0]);


            const minutes =
                parts[1];


            if (Number.isNaN(hours)) {
                return String(value);
            }


            const period =
                hours >= 12 ? "PM" : "AM";


            hours =
                hours % 12 || 12;


            return `${hours}:${minutes} ${period}`;

        }


        function formatDuration(minutes) {

            const value =
                Number(minutes);


            if (
                !Number.isFinite(value) ||
                value <= 0
            ) {

                return "Not recorded";

            }


            const hours =
                Math.floor(value / 60);


            const remainingMinutes =
                value % 60;


            if (hours && remainingMinutes) {

                return `${hours} hour${
                    hours === 1 ? "" : "s"
                } ${remainingMinutes} minute${
                    remainingMinutes === 1 ? "" : "s"
                }`;

            }


            if (hours) {

                return `${hours} hour${
                    hours === 1 ? "" : "s"
                }`;

            }


            return `${remainingMinutes} minute${
                remainingMinutes === 1 ? "" : "s"
            }`;

        }


        function formatCurrency(amount) {

            const value =
                Number(amount);


            if (!Number.isFinite(value)) {
                return "₱0";
            }


            return new Intl.NumberFormat(
                "en-PH",
                {
                    style: "currency",
                    currency: "PHP",
                    minimumFractionDigits: 0,
                    maximumFractionDigits: 2
                }
            ).format(value);

        }


        function escapeHTML(value) {

            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* =========================
           INITIALIZE
        ========================== */

        loadServiceHistory();

    </script>


    <!-- SHARED CUSTOMER HEADER JS -->
    <script src="js/customer-header.js"></script>

</body>

</html>
